<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>New Employee Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal_common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='portal_auth.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card wide">
    <a class="back-link" href="{{ return_to if return_to else url_for('portal.employee_login') }}">
      ← Back
    </a>

    <h1>New Employee Account</h1>

    {% if error %}
      <p class="form-error">{{ error }}</p>
    {% endif %}

    <form method="post" class="signup-grid">
      <input type="hidden" name="return_to" value="{{ return_to or '' }}">

      <label>
        Full Name
        <input name="display_name" value="{{ prefill_name or '' }}" required>
      </label>

      <label>
        Email
        <input name="email" type="email" value="{{ prefill_email or '' }}" required>
      </label>

      <label>
        Password
        <input
          name="password"
          type="password"
          required
          autocomplete="new-password"
        >
      </label>

      <label>
        Phone
        <input name="phone" type="tel" value="{{ prefill_phone or '' }}">
      </label>

      <label class="extension-check-label">
        Extension
        <span class="extension-check-control">
          <input id="hasExtensionCheckbox" type="checkbox">
          <span>Check if you have an extension</span>
        </span>
      </label>
      <input type="hidden" name="phone_extension" id="hiddenExtension" value="">

      <button class="portal-button full" type="submit">
        Submit
      </button>
    </form>

    <!-- Phone Extension Dialog -->
    <dialog id="extensionDialog" class="extension-dialog">
      <h2>Phone Extension</h2>
      <label>
        Extension
        <input id="extensionInput" type="text">
      </label>
      <div class="extension-dialog-actions">
        <button id="saveExtension" class="portal-button" type="button">
          OK
        </button>
      </div>
    </dialog>

    <script>
      (function () {
        const checkbox = document.getElementById("hasExtensionCheckbox");
        const dialog = document.getElementById("extensionDialog");
        const input = document.getElementById("extensionInput");
        const hidden = document.getElementById("hiddenExtension");

        document.getElementById("saveExtension").addEventListener("click", () => {
          hidden.value = input.value.trim();
          dialog.close();
        });

        checkbox.addEventListener("change", () => {
          if (checkbox.checked) {
            dialog.showModal();
            input.focus();
          } else {
            hidden.value = "";
            input.value = "";
          }
        });
      })();
    </script>
  </main>
</body>
</html>
