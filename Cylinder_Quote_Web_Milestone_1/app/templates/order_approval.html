<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Approval</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='approval.css') }}">
</head>
<body class="approval-page">
  <main class="approval-card">
    <img src="{{ url_for('static', filename='quote_form_logo.png') }}" alt="JIT Cylinders" class="approval-logo">
    <h1>Order Approval</h1>
    <p class="approval-quote">Quote: <strong>{{ quote_number }}</strong></p>
    <p class="approval-note">Review the order information before choosing an approval action.</p>
    <div class="approval-actions" aria-label="Order approval actions">
      <button type="button" class="approval-button approve">Approve Order</button>
      <button type="button" class="approval-button deny">Deny Order</button>
    </div>
    <p class="approval-placeholder">Approval actions will be connected in a later step.</p>
  </main>
</body>
</html>
